  </g>
  <line x1="60" y1="370" x2="1140" y2="370" stroke="#ECECEC" stroke-width="2"/>
  <text x="60" y="420" font-size="26" font-weight="700" fill="#000000">Two flagged additions</text>
  <text x="640" y="420" font-size="26" font-weight="700" fill="#000000">Tints derived from light grey</text>
  <g font-size="17">
    <rect x="60" y="445" width="240" height="100" rx="8" fill="#00557F"/>
    <text x="60" y="574" font-weight="700" fill="#000">Secondary dark blue</text><text x="60" y="598" fill="#3F4041">#00557F · 8.06:1</text>
    <rect x="320" y="445" width="240" height="100" rx="8" fill="#005FCC"/>
    <text x="320" y="574" font-weight="700" fill="#000">Focus ring</text><text x="320" y="598" fill="#3F4041">#005FCC · 5.98:1</text>
    <rect x="640" y="445" width="115" height="100" rx="8" fill="#F9F9F9" stroke="#E2E2E2"/>
    <rect x="765" y="445" width="115" height="100" rx="8" fill="#F5F5F5" stroke="#E2E2E2"/>
    <rect x="890" y="445" width="115" height="100" rx="8" fill="#ECECEC"/>
    <rect x="1015" y="445" width="125" height="100" rx="8" fill="#E2E2E2"/>
    <text x="640" y="574" font-weight="700" fill="#000">~10% · ~16% · ~30% · ~45%</text><text x="640" y="598" fill="#3F4041">Panels, dividers and borders</text>
