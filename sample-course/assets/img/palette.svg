<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Roboto, Arial, sans-serif">
  <rect width="1200" height="640" fill="#FFFFFF"/>
  <text x="60" y="64" font-size="26" font-weight="700" fill="#000000">Official palette</text>
  <text x="60" y="94" font-size="17" fill="#3F4041">Brand blue, black, white and three greys</text>
  <g font-size="17">
    <rect x="60" y="120" width="250" height="150" rx="8" fill="#006DAE"/>
    <text x="78" y="300" font-weight="700" fill="#000">Brand blue</text><text x="78" y="324" fill="#3F4041">#006DAE · 5.53:1</text>
    <rect x="330" y="120" width="250" height="150" rx="8" fill="#000000"/>
    <text x="348" y="300" font-weight="700" fill="#000">Black</text><text x="348" y="324" fill="#3F4041">#000000 · 21:1</text>
    <rect x="600" y="120" width="250" height="150" rx="8" fill="#FFFFFF" stroke="#BFBFBF" stroke-width="2"/>
    <text x="618" y="300" font-weight="700" fill="#000">White</text><text x="618" y="324" fill="#3F4041">#FFFFFF</text>
